
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07060b">

    <title>SIXVOID APIS | Token Inválido</title>

    <link rel="icon" href="https://i.imgur.com/gLP69vO.jpeg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --bg: #07060b;
            --purple: #8b4dff;
            --pink: #c45cff;
            --white: #f8f5ff;
            --muted: #a49ab4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background:
                radial-gradient(
                    circle at 50% 15%,
                    rgba(139,77,255,.17),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(196,92,255,.09),
                    transparent 35%
                ),
                var(--bg);

            color: var(--white);
            font-family: "DM Sans", sans-serif;
        }

        /* FUNDO ANIMADO */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .glow {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: .18;
            animation: glowMove 12s ease-in-out infinite alternate;
        }

        .glow.one {
            background: #7136d6;
            top: -180px;
            left: -100px;
        }

        .glow.two {
            background: #c45cff;
            bottom: -200px;
            right: -100px;
            animation-delay: -5s;
        }

        .stars {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 10% 20%, #fff 100%, transparent),
                radial-gradient(1px 1px at 30% 70%, #c9aaff 100%, transparent),
                radial-gradient(2px 2px at 60% 30%, #fff 100%, transparent),
                radial-gradient(1px 1px at 80% 80%, #fff 100%, transparent),
                radial-gradient(1px 1px at 90% 15%, #c9aaff 100%, transparent);

            background-size: 260px 260px;
            animation: starsMove 45s linear infinite;
            opacity: .55;
        }

        /* CONTEÚDO */

        .container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 2;
            animation: appear .9s ease both;
        }

        .top-label {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;

            color: #b69bdf;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 4px;
        }

        .top-label::before,
        .top-label::after {
            content: "";
            width: 30px;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                var(--purple)
            );
        }

        .card {
            position: relative;
            overflow: hidden;
            text-align: center;

            padding: 40px 27px 30px;

            border: 1px solid rgba(139,77,255,.25);
            border-radius: 25px;

            background: linear-gradient(
                145deg,
                rgba(25,18,39,.95),
                rgba(10,8,16,.96)
            );

            box-shadow:
                0 25px 80px rgba(0,0,0,.5),
                0 0 45px rgba(139,77,255,.10),
                inset 0 1px rgba(255,255,255,.04);

            backdrop-filter: blur(18px);
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 15%;
            width: 70%;
            height: 1px;

            background: linear-gradient(
                90deg,
                transparent,
                var(--pink),
                transparent
            );

            box-shadow: 0 0 15px var(--purple);
        }

        /* LOGO */

        .logo {
            width: 110px;
            height: 110px;

            margin: 0 auto 23px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 30px;

            background: linear-gradient(
                145deg,
                #35165c,
                #100b19
            );

            border: 1px solid rgba(174,124,255,.55);

            box-shadow:
                0 0 35px rgba(139,77,255,.3),
                inset 0 0 25px rgba(139,77,255,.12);

            transform: rotate(-6deg);
            animation: floating 4s ease-in-out infinite;
        }

        .logo span {
            font-family: "Space Grotesk", sans-serif;
            font-size: 70px;
            font-weight: 800;
            font-style: italic;

            color: #fff;

            text-shadow:
                0 0 10px #8b4dff,
                0 0 30px #a66aff;

            transform: rotate(6deg);
        }

        h1 {
            font-family: "Space Grotesk", sans-serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            margin-top: 8px;
            color: #a995c5;
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .divider {
            width: 60px;
            height: 2px;
            margin: 27px auto;

            background: linear-gradient(
                90deg,
                var(--purple),
                var(--pink)
            );

            box-shadow: 0 0 15px var(--purple);
        }

        /* ERRO */

        .error-icon {
            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 15px;

            border-radius: 15px;

            color: #d8bdff;
            font-size: 20px;

            background: rgba(139,77,255,.13);
            border: 1px solid rgba(174,124,255,.25);
        }

        .error-title {
            color: #f3eaff;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .description {
            max-width: 310px;
            margin: 12px auto 25px;

            color: var(--muted);
            font-size: 13px;
            line-height: 1.8;
        }

        /* BOTÕES */

        .actions {
            display: grid;
            gap: 12px;
        }

        .btn {
            min-height: 49px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            padding: 12px 18px;

            border-radius: 12px;

            text-decoration: none;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;

            transition: .3s ease;
        }

        .btn:hover {
            transform: translateY(-4px);
        }

        .btn-buy {
            color: white;

            background: linear-gradient(
                100deg,
                #7136d6,
                #9b52ed,
                #c45cff
            );

            box-shadow: 0 8px 25px rgba(139,77,255,.25);
        }

        .btn-buy:hover {
            color: white;
            box-shadow: 0 10px 35px rgba(139,77,255,.45);
        }

        .btn-back {
            color: #d6c9e8;
            background: rgba(255,255,255,.025);
            border: 1px solid rgba(176,139,225,.22);
        }

        .btn-back:hover {
            color: white;
            border-color: var(--purple);
            background: rgba(139,77,255,.08);
        }

        /* REDES SOCIAIS */

        .socials {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .socials a {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #b9a9ce;
            font-size: 17px;

            border-radius: 12px;
            border: 1px solid rgba(176,139,225,.15);
            background: rgba(255,255,255,.035);

            text-decoration: none;
            transition: .3s;
        }

        .socials a:hover {
            color: white;
            transform: translateY(-4px);
            border-color: var(--purple);
            box-shadow: 0 5px 20px rgba(139,77,255,.2);
        }

        /* RODAPÉ */

        .footer {
            margin-top: 22px;
            text-align: center;

            color: #716580;
            font-size: 9px;
            letter-spacing: 2px;
        }

        .footer strong {
            color: #a47bdf;
        }

        /* ANIMAÇÕES */

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes floating {
            0%, 100% {
                transform: translateY(0) rotate(-6deg);
            }
            50% {
                transform: translateY(-9px) rotate(-2deg);
            }
        }

        @keyframes glowMove {
            from {
                transform: translate(0,0) scale(1);
            }
            to {
                transform: translate(60px,-40px) scale(1.2);
            }
        }

        @keyframes starsMove {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(-260px);
            }
        }

        /* CELULARES */

        @media (max-width: 420px) {
            .card {
                padding: 35px 21px 27px;
            }

            h1 {
                font-size: 28px;
            }

            .logo {
                width: 98px;
                height: 98px;
            }

            .logo span {
                font-size: 62px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

    <!-- FUNDO ANIMADO -->

    <div class="background">
        <div class="glow one"></div>
        <div class="glow two"></div>
        <div class="stars"></div>
    </div>

    <!-- TELA DE ERRO -->

    <main class="container">

        <section class="card">

        <footer class="footer">

    </main>

    <script>
        document.getElementById("year").textContent =

    </script>

</body>
</html>
