services:
  - type: web
    name: sixvoid-apis
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: sixvoid-data
      mountPath: /opt/render/project/src/lib/secret
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: OWNER_WHATSAPP
        sync: false
      - key: OWNER_INSTAGRAM
        sync: false
